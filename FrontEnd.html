<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Browser toolbar */

    #toolbar {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: #1b1b1b;
      border-bottom: 1px solid #333;
    }

    button {
      height: 38px;
      min-width: 38px;
      border: 0;
      border-radius: 8px;
      background: #292929;
      color: #ddd;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #383838;
    }

    #url {
      flex: 1;
      height: 38px;
      border: 1px solid #3d3d3d;
      border-radius: 20px;
      outline: none;
      padding: 0 16px;
      background: #242424;
      color: white;
      font-size: 15px;
    }

    #url:focus {
      border-color: #666;
    }

    #status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #777;
      margin-left: 3px;
    }

    #status.connected {
      background: #45d483;
    }

    #status.error {
      background: #e05252;
    }

    /* Browser area */

    #browser {
      position: absolute;
      top: 58px;
      left: 0;
      width: 100%;
      height: calc(100% - 58px);
      border: 0;
      background: white;
    }

    /* Startup screen */

    #welcome {
      position: absolute;
      top: 58px;
      left: 0;
      width: 100%;
      height: calc(100% - 58px);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: #111;
      z-index: 5;
    }

    #welcome h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    #welcome p {
      margin: 0;
      color: #888;
    }

    #welcome.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div id="toolbar">

    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reload" title="Reload">↻</button>

    <input
      id="url"
      type="text"
      value="https://example.com"
      placeholder="Enter a web address..."
      spellcheck="false"
      autocomplete="off"
    >

    <button id="go">Go</button>

    <div id="status" title="Wisp connection"></div>

  </div>

  <div id="welcome">
    <h1>Scramjet</h1>
    <p>Enter an address above to begin.</p>
  </div>

<iframe
  id="browser"
  style="
    position:absolute;
    top:58px;
    left:0;
    width:100%;
    height:calc(100% - 58px);
    border:0;
    background:white;
  ">
</iframe>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script type="module">
  import { ScramjetController } from "https://unpkg.com/@mercuryworkshop/scramjet@latest/dist/scramjet.bundle.js";

  window.ScramjetController = ScramjetController;
</script>
  <script>

    /*
     * ============================================================
     * CONFIGURATION
     * ============================================================
     */

    // PUT YOUR CODESPACE WISP ADDRESS HERE.
    //
    // Example:
    //
    // wss://something-5001.app.github.dev/
    //
    let WISP_URL = null;


async function getWispServer() {

  const response = await fetch(
    "https://scramregister.blackj9898.workers.dev/get"
  );

  const data = await response.json();

  if (!data.url) {
    throw new Error("No Scramjet server online");
  }

  WISP_URL = data.url.replace(
    "https://",
    "wss://"
  );

  console.log(
    "Using Wisp server:",
    WISP_URL
  );

  return WISP_URL;
}
async function getScramjetServer() {

  const response = await fetch(
    "https://scramregister.blackj9898.workers.dev/get"
  );

  const data = await response.json();

  if (!data.url) {
    throw new Error("No Scramjet server online");
  }

  console.log(
    "Using Scramjet server:",
    data.url
  );

  return data.url;
}
    /*
     * ============================================================
     * ELEMENTS
     * ============================================================
     */

    const urlInput = document.getElementById("url");
    const goButton = document.getElementById("go");

    const backButton = document.getElementById("back");
    const forwardButton = document.getElementById("forward");
    const reloadButton = document.getElementById("reload");

    const browser = document.getElementById("browser");
    const welcome = document.getElementById("welcome");
    const status = document.getElementById("status");

    let scramjet;


async function initScramjet() {

  await getWispServer();

  scramjet = new ScramjetController({
  files: {
    wasm: "https://unpkg.com/@mercuryworkshop/scramjet@latest/dist/scramjet.wasm.wasm"
  },
  prefix: "/scramjet/",
  wisp: WISP_URL
});

  await scramjet.init();

  console.log("Scramjet initialized!");
}


    /*
     * ============================================================
     * ADDRESS BAR
     * ============================================================
     */

    function normalizeURL(value) {

      value = value.trim();

      if (!value) {
        return null;
      }

      // If the user typed:
      //
      // example.com
      //
      // turn it into:
      //
      // https://example.com

      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) {
        value = "https://" + value;
      }

      return value;
    }


    function navigate() {

  const url = normalizeURL(urlInput.value);

  if (!url) {
    return;
  }

  console.log("Navigate:", url);

  urlInput.value = url;

  openScramjet(url);

  welcome.classList.add("hidden");
}
async function openScramjet(url) {

  const server = await getScramjetServer();

  console.log("Opening Scramjet:", server);

  const win = window.open(
    server,
    "_blank",
    "width=1200,height=800"
  );

  if (!win) {
    alert("Popup blocked!");
  }

}


    /*
     * ============================================================
     * BUTTONS
     * ============================================================
     */

    goButton.addEventListener("click", navigate);


    urlInput.addEventListener("keydown", event => {

      if (event.key === "Enter") {
        navigate();
      }

    });


    reloadButton.addEventListener("click", () => {

      if (browser.src) {
        browser.contentWindow.location.reload();
      }

    });


    backButton.addEventListener("click", () => {

      try {
        browser.contentWindow.history.back();
      } catch (error) {
        console.log("Back unavailable:", error);
      }

    });


    forwardButton.addEventListener("click", () => {

      try {
        browser.contentWindow.history.forward();
      } catch (error) {
        console.log("Forward unavailable:", error);
      }

    });


    /*
     * ============================================================
     * START
     * ============================================================
     */
      window.addEventListener("load", () => {

  initScramjet()
    .then(() => {
      status.classList.add("connected");
      console.log("Scramjet + Wisp ready!");
    })
    .catch(err => {
      console.error(err);
      status.classList.add("error");
    });

});
  </script>

</body>
</html>
